    <!-- Google Analytics (Lazy Load on User Interaction / Idle for Zero Unused JS & Main-Thread Blocking) -->
    <script>
      (function() {
        var gtmLoaded = false;
        function loadGTM() {
          if (gtmLoaded) return;
          gtmLoaded = true;

          // Remove listeners
          window.removeEventListener('scroll', loadGTM, { passive: true });
          window.removeEventListener('touchstart', loadGTM, { passive: true });
          window.removeEventListener('mousemove', loadGTM, { passive: true });
          window.removeEventListener('click', loadGTM, { passive: true });

          var script = document.createElement('script');
          script.async = true;
          script.src = "https://www.googletagmanager.com/gtag/js?id=G-VVFQS6FS7G";
          document.head.appendChild(script);

          script.onload = function() {
            window.dataLayer = window.dataLayer || [];
            function gtag() { dataLayer.push(arguments); }
            gtag("js", new Date());
            gtag("config", "G-VVFQS6FS7G");
          };
        }

        // Trigger on first user interaction
        window.addEventListener('scroll', loadGTM, { passive: true, once: true });
        window.addEventListener('touchstart', loadGTM, { passive: true, once: true });
        window.addEventListener('mousemove', loadGTM, { passive: true, once: true });
        window.addEventListener('click', loadGTM, { passive: true, once: true });

        // Fallback after 4 seconds idle
        if ('requestIdleCallback' in window) {
          window.requestIdleCallback(function() {
            setTimeout(loadGTM, 4000);
          });
        } else {
          setTimeout(loadGTM, 4000);
        }
      })();
    </script>
  </body>
